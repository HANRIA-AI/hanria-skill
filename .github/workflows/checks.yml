      - name: The validator refuses what it does not implement, everywhere
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'skills/hanria/scripts')
          import _schema
          def must_refuse(name, schema, doc):
              try:
                  _schema.validate(doc, schema)
              except _schema.SchemaError:
                  return
              raise AssertionError('%s was accepted and must not be' % name)
          must_refuse('unknown format',
                      {"type": "object", "properties": {"a": {"type": "string", "format": "email"}}},
                      {"a": "x"})
          must_refuse('unsupported keyword under an absent property',
                      {"type": "object", "properties": {"missing": {"type": "string", "pattern": "^x$"}}},
                      {})
          must_refuse('impossible calendar date',
                      {"type": "string", "format": "date-time"}, "2026-02-31T00:00:00Z")
          _schema.validate("2026-02-28T00:00:00Z", {"type": "string", "format": "date-time"})
          print('validator refuses unimplemented keywords, formats and impossible dates')
          PY
      - name: SKILL.md frontmatter is valid YAML and the skill is installable
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import re, yaml
          # The installer parses this frontmatter. A description containing ": "
          # made YAML read a nested mapping, the file was skipped, and the
          # documented install command silently installed nothing.
          for f in ('SKILL.md', 'skills/hanria/SKILL.md'):
              text = open(f).read()
              m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
              assert m, '%s has no YAML frontmatter' % f
              try:
                  data = yaml.safe_load(m.group(1))
              except yaml.YAMLError as exc:
                  raise AssertionError('%s frontmatter is not valid YAML: %s' % (f, exc))
              assert isinstance(data, dict), '%s frontmatter is not a mapping' % f
              for key in ('name', 'description'):
                  assert data.get(key), '%s frontmatter has no %r' % (f, key)
              assert isinstance(data['description'], str), \
                  '%s description parsed as %s, not a string' % (f, type(data['description']).__name__)
              # Registries commonly extract the description with a plain regex
              # rather than a YAML parser. A folded scalar is valid YAML and
              # shows up in those listings as a literal ">-", so the two must
              # agree: keep the description a single-line plain scalar.
              naive = re.search(r'^description:\s*(.+)$', m.group(1), re.M)
              assert naive, '%s description is not on one line a naive parser can read' % f
              assert naive.group(1).strip() == data['description'], (
                  '%s: a naive "description:" extractor reads %r, the YAML parser reads %r'
                  % (f, naive.group(1)[:40], data['description'][:40]))
              assert ': ' not in data['description'], \
                  '%s description contains ": ", which YAML reads as a nested mapping' % f
              print('%s: name=%s, description %d chars, both parsers agree'
                    % (f, data['name'], len(data['description'])))
          PY

      - name: A prefix with no boundary is refused, in every shape
        run: |
          python3 - <<'PY'
          import json, subprocess, tempfile, os
          # Three shapes of an unbounded prefix. The first two were already
          # refused; the bare hostname fell through both guards and permitted
          # a request to an attacker-controlled host. Regression test for that.
          BASE = {"schema_version": "0.2-draft", "mandate_id": "m", "issued_by": "t",
                  "purpose": "boundary regression", "not_valid_after": "2099-01-01T00:00:00Z",
                  "default": "deny", "requires_human": []}
          ACTION = {"schema_version": "0.1-draft",
                    "requested_by": {"agent": "t", "session": "s"},
                    "justification": "regression",
                    "operation": {"kind": "network", "verb": "post",
                                  "target": "api.trusted.example.attacker.test/steal"}}
          d = tempfile.mkdtemp()
          a = os.path.join(d, "a.json")
          json.dump(ACTION, open(a, "w"))
          for bad in ("https://api.trusted.example", "/srv/data", "api.trusted.example"):
              m = dict(BASE, clauses=[{"id": "c1", "effect": "permit",
                       "match": {"kind": ["network"], "verb": ["post"],
                                 "target_prefix": [bad]}}])
              mp = os.path.join(d, "m.json")
              json.dump(m, open(mp, "w"))
              r = subprocess.run(["python3", "skills/hanria/scripts/check_action.py",
                                  "--mandate", mp, "--action", a],
                                 capture_output=True, text=True)
              out = json.loads(r.stdout)
              assert out["outcome"] != "permit", \
                  "unbounded prefix %r produced %s" % (bad, out["outcome"])
              assert "boundary" in out["reason"], \
                  "unbounded prefix %r was not refused for its boundary: %s" % (bad, out["reason"])
          # A properly bounded prefix must still permit its own target.
          m = dict(BASE, clauses=[{"id": "c1", "effect": "permit",
                   "match": {"kind": ["network"], "verb": ["post"],
                             "target_prefix": ["api.trusted.example/"]}}])
          mp = os.path.join(d, "m.json")
          json.dump(m, open(mp, "w"))
          good = dict(ACTION)
          good["operation"] = dict(ACTION["operation"], target="api.trusted.example/v1/x")
          gp = os.path.join(d, "g.json")
          json.dump(good, open(gp, "w"))
          r = subprocess.run(["python3", "skills/hanria/scripts/check_action.py",
                              "--mandate", mp, "--action", gp], capture_output=True, text=True)
          assert json.loads(r.stdout)["outcome"] == "permit", "bounded prefix stopped working"
          # ...and must refuse the attacker host.
          r = subprocess.run(["python3", "skills/hanria/scripts/check_action.py",
                              "--mandate", mp, "--action", a], capture_output=True, text=True)
          assert json.loads(r.stdout)["outcome"] == "deny", "bounded prefix let the attacker host through"
          print("unbounded prefixes refused in all three shapes; bounded prefix still correct")
          PY

      - name: A log entry with a duplicate key never verifies as intact
        run: |
          python3 - <<'PY'
          import json, subprocess, tempfile, os
          # A duplicate key makes an entry ambiguous: a reader sees the first
          # value, json keeps the last. The chain committed to the last, so a
          # forged body could sit above it and the log still read "intact".
          d = tempfile.mkdtemp()
          log = os.path.join(d, "log.jsonl")
          a = os.path.join(d, "a.json")
          json.dump({"schema_version": "0.1-draft",
                     "requested_by": {"agent": "t", "session": "s"},
                     "justification": "regression",
                     "operation": {"kind": "file", "verb": "read",
                                   "target": "/srv/tickets/x.json"}}, open(a, "w"))
          o = os.path.join(d, "o.json")
          r = subprocess.run(["python3", "skills/hanria/scripts/check_action.py",
                              "--mandate", "skills/hanria/examples/mandate.example.json",
                              "--action", a], capture_output=True, text=True)
          open(o, "w").write(r.stdout)
          subprocess.run(["python3", "skills/hanria/scripts/record.py", "append",
                          "--log", log, "--action", a, "--outcome", o],
                         capture_output=True, text=True, check=True)
          r = subprocess.run(["python3", "skills/hanria/scripts/record.py", "verify",
                              "--log", log], capture_output=True, text=True)
          assert json.loads(r.stdout)["status"] == "intact", "baseline log did not verify"
          entry = json.loads(open(log).read().strip())
          rest = {k: v for k, v in entry.items() if k != "body"}
          forged = json.dumps({"forged": True}, separators=(",", ":"))
          real = json.dumps(entry["body"], sort_keys=True, separators=(",", ":"))
          open(log, "w").write(json.dumps(rest, separators=(",", ":"))[:-1]
                               + ',"body":' + forged + ',"body":' + real + "}\n")
          r = subprocess.run(["python3", "skills/hanria/scripts/record.py", "verify",
                              "--log", log], capture_output=True, text=True)
          assert json.loads(r.stdout).get("status") != "intact", \
              "a forged duplicate-key entry verified as intact"
          # append must refuse the same log rather than chaining onto it.
          r = subprocess.run(["python3", "skills/hanria/scripts/record.py", "append",
                              "--log", log, "--action", a, "--outcome", o],
                             capture_output=True, text=True)
          assert r.returncode != 0, "append accepted a log with an ambiguous entry"
          print("duplicate-key entries refused by both verify and append")
          PY
