      - name: RFC 3339 is enforced as RFC 3339
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'skills/hanria/scripts')
          import _schema
          ok = ["2999-01-01T00:00:00Z", "2016-12-31T23:59:60Z",
                "2026-09-04T12:00:00+02:00", "2026-09-04t12:00:00z"]
          bad = ["2999-01-01 00:00:00Z", "2999-01-01", "2999-13-01T00:00:00Z",
                 "2026-09-04T25:00:00Z", "2026-09-04T12:00:00"]
          for t in ok:
              assert _schema._RFC3339.match(t), 'must accept %r' % t
          for t in bad:
              assert not _schema._RFC3339.match(t), 'must reject %r' % t
          print('RFC 3339: space separator and partial timestamps rejected, leap second accepted')
          PY
