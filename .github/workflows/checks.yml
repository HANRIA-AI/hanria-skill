name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: Schemas and manifests are valid JSON
        run: |
          for f in skills/hanria/schema/*.json plugin.json hanria-skill.json skills/hanria/examples/*.json; do
            python3 -c "import json,sys;json.load(open('$f'));print('ok $f')"
          done
      - name: Detection reports absent, and exits 1
        run: |
          set +e
          out=$(python3 skills/hanria/scripts/detect_runtime.py); code=$?
          echo "$out"
          test "$code" = "1" || { echo "expected exit 1 (absent), got $code"; exit 1; }
          grep -q '"status": "absent"' <<<"$out" || { echo "expected status absent"; exit 1; }
      - name: plugin.json conforms to Agent Plugins 1.0.0
        run: |
          python3 - <<'PY'
          import json,re,sys
          d=json.load(open('plugin.json'))
          allowed={'$schema','name','version','description','author','homepage','repository','license','keywords','extensions'}
          extra=set(d)-allowed
          assert not extra, f'non-spec top-level fields: {extra}'
          assert d.get('$schema')=='https://agent-plugins.org/schemas/1.0.0/plugin.schema.json', 'wrong $schema'
          n=d['name']
          assert 1<=len(n)<=64 and re.fullmatch(r'[a-z0-9][a-z0-9.-]*[a-z0-9]',n) and '--' not in n and '..' not in n, f'bad name: {n}'
          print('plugin.json conforms:',n)
          PY
      - name: Skill is discoverable at both the root and the plugin path
        run: |
          test -f SKILL.md || { echo "SKILL.md missing at root (breaks npx skills add)"; exit 1; }
          test -f skills/hanria/SKILL.md || { echo "skills/hanria/SKILL.md missing (breaks Agent Plugins)"; exit 1; }
      - name: No credential-shaped literals committed
        run: |
          ! grep -rIn --exclude-dir=.git -E 'sk-live-[A-Za-z0-9]{12,}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY' . \
            || { echo "possible secret committed"; exit 1; }
      - name: The operator entity is not named anywhere
        run: |
          # Bracketed so this line does not match its own pattern.
          ! grep -rIn --exclude-dir=.git -i '[k]aal' . \
            || { echo "operator entity must not appear on any HANRIA surface"; exit 1; }
      - name: Mandate check returns permit, deny and escalate correctly
        run: |
          set +e
          M=skills/hanria/examples/mandate.example.json
          check () {
            out=$(python3 skills/hanria/scripts/check_action.py --mandate $M --action "$1"); code=$?
            echo "$out"
            test "$code" = "$2" || { echo "$1: expected exit $2, got $code"; exit 1; }
            grep -q "\"outcome\": \"$3\"" <<<"$out" || { echo "$1: expected $3"; exit 1; }
          }
          check skills/hanria/examples/action.read-ticket.json 0 permit
          check skills/hanria/examples/action.read-home.json 1 deny
          check skills/hanria/examples/action.refund.json 2 escalate
      - name: An amount over the clause ceiling does not permit
        run: |
          set +e
          out=$(python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json \
            --action skills/hanria/examples/action.refund-too-large.json); code=$?
          echo "$out"
          test "$code" = "1" || { echo "expected deny (exit 1), got $code"; exit 1; }
          grep -q 'exceeds the ceiling' <<<"$out" || { echo "expected the ceiling named in the reason"; exit 1; }
      - name: A request carrying a credential is denied by the checker too
        run: |
          set +e
          out=$(python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json \
            --action skills/hanria/examples/rejected-secret.json); code=$?
          echo "$out"
          test "$code" = "1" || { echo "expected deny (exit 1), got $code"; exit 1; }
          grep -q 'credential' <<<"$out" || exit 1
      - name: Evaluation fails closed on an expired or malformed mandate
        run: |
          set +e
          python3 -c "import json;m=json.load(open('skills/hanria/examples/mandate.example.json'));m['not_valid_after']='2020-01-01T00:00:00Z';json.dump(m,open('/tmp/expired.json','w'))"
          out=$(python3 skills/hanria/scripts/check_action.py --mandate /tmp/expired.json \
            --action skills/hanria/examples/action.read-ticket.json); code=$?
          echo "$out"
          test "$code" = "1" || { echo "expired mandate must deny, got $code"; exit 1; }
          echo '{"schema_version":"0.2-draft"}' > /tmp/bad.json
          out=$(python3 skills/hanria/scripts/check_action.py --mandate /tmp/bad.json \
            --action skills/hanria/examples/action.read-ticket.json); code=$?
          echo "$out"
          test "$code" = "3" || { echo "malformed mandate must error, got $code"; exit 1; }
          grep -qv '"outcome": "permit"' <<<"$out" || { echo "must never permit"; exit 1; }
      - name: The log chain detects alteration and deletion
        run: |
          set +e
          L=/tmp/chain.jsonl; rm -f $L $L.head $L.lock  # the head sidecar too, or a
          # re-run starts with an empty log against a stale pin and the
          # truncation detector correctly fails a chain that is simply new
          for a in read-ticket read-home refund; do
            python3 skills/hanria/scripts/check_action.py \
              --mandate skills/hanria/examples/mandate.example.json \
              --action skills/hanria/examples/action.$a.json > /tmp/out.json
            python3 skills/hanria/scripts/record.py append --log $L \
              --action skills/hanria/examples/action.$a.json --outcome /tmp/out.json
          done
          python3 skills/hanria/scripts/record.py verify --log $L || { echo "fresh chain must verify"; exit 1; }
          python3 - <<'PY'
          import json
          e=[json.loads(l) for l in open('/tmp/chain.jsonl') if l.strip()]
          e[1]['body']['outcome']['outcome']='permit'
          open('/tmp/chain.jsonl','w').write('\n'.join(json.dumps(x,sort_keys=True,separators=(',',':')) for x in e)+'\n')
          PY
          python3 skills/hanria/scripts/record.py verify --log $L; code=$?
          test "$code" = "1" || { echo "a flipped outcome must break the chain, got $code"; exit 1; }
          python3 skills/hanria/scripts/record.py append --log $L \
            --action skills/hanria/examples/action.read-ticket.json --outcome /tmp/out.json; code=$?
          test "$code" != "0" || { echo "must refuse to append to a broken chain"; exit 1; }
      - name: Credential shapes are refused even in innocuous field names
        run: |
          set +e
          M=skills/hanria/examples/mandate.example.json
          mk () {
            python3 -c "import json,sys; json.dump({'schema_version':'0.1-draft','requested_by':{'agent':'x'},'operation':{'kind':'file','verb':'read','target':'/srv/tickets/a.json','parameters':{sys.argv[1]:sys.argv[2]}},'justification':'t'}, open('/tmp/c.json','w'))" "$1" "$2"
          }
          try () {
            mk "$1" "$2"
            python3 skills/hanria/scripts/check_action.py --mandate $M --action /tmp/c.json; code=$?
            test "$code" = "1" || { echo "credential in field '$1' was not denied (exit $code)"; exit 1; }
            echo "denied: $1"
          }
          try authorization "Bearer abc.def.ghijkl"
          try cookie "session=abc123def456"
          try note "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.sIgNaTuRe"
          try note "AKIAIOSFODNN7EXAMPLE"
          try note "ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      - name: An unrecognized mandate condition is refused, never ignored
        run: |
          set +e
          python3 -c "import json; m=json.load(open('skills/hanria/examples/mandate.example.json')); m['clauses'][0]['match']['path_regex']='^/other/'; json.dump(m,open('/tmp/m_unknown.json','w'))"
          out=$(python3 skills/hanria/scripts/check_action.py --mandate /tmp/m_unknown.json \
                  --action skills/hanria/examples/action.read-ticket.json); code=$?
          echo "$out"
          test "$code" = "3" || { echo "unknown match key must error, got $code"; exit 1; }
          grep -qv '"outcome": "permit"' <<<"$out" || { echo "must never permit"; exit 1; }
      - name: A string where a list belongs is refused, not iterated per character
        run: |
          set +e
          python3 -c "import json; m=json.load(open('skills/hanria/examples/mandate.example.json')); m['clauses'][0]['match']['target_prefix']='/srv/tickets/'; json.dump(m,open('/tmp/m_str.json','w'))"
          python3 skills/hanria/scripts/check_action.py --mandate /tmp/m_str.json \
            --action skills/hanria/examples/action.read-home.json; code=$?
          test "$code" = "3" || { echo "string target_prefix must error, got $code"; exit 1; }
      - name: A request missing required fields does not permit
        run: |
          set +e
          echo '{"operation":{"kind":"file","verb":"read","target":"/srv/tickets/a.json"}}' > /tmp/bare.json
          python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json --action /tmp/bare.json; code=$?
          test "$code" = "1" || { echo "incomplete request must deny, got $code"; exit 1; }
      - name: Non-finite and negative amounts error rather than compare
        run: |
          set +e
          for v in NaN Infinity -100.00; do
            python3 -c "import json,sys; a=json.load(open('skills/hanria/examples/action.refund.json')); a['operation']['amount']['value']=sys.argv[1]; json.dump(a,open('/tmp/amt.json','w'))" "$v"
            python3 skills/hanria/scripts/check_action.py \
              --mandate skills/hanria/examples/mandate.example.json --action /tmp/amt.json; code=$?
            test "$code" = "3" || { echo "amount '$v' must error, got $code"; exit 1; }
          done
      - name: Terminal truncation of the log is detected via the head file
        run: |
          set +e
          L=/tmp/trunc.jsonl; rm -f $L $L.head
          for a in read-ticket read-home refund; do
            python3 skills/hanria/scripts/check_action.py \
              --mandate skills/hanria/examples/mandate.example.json \
              --action skills/hanria/examples/action.$a.json > /tmp/o.json
            python3 skills/hanria/scripts/record.py append --log $L \
              --action skills/hanria/examples/action.$a.json --outcome /tmp/o.json
          done
          python3 skills/hanria/scripts/record.py verify --log $L || { echo "fresh chain must verify"; exit 1; }
          python3 -c "l=[x for x in open('/tmp/trunc.jsonl') if x.strip()][:-1]; open('/tmp/trunc.jsonl','w').writelines(l)"
          out=$(python3 skills/hanria/scripts/record.py verify --log $L); code=$?
          echo "$out"
          test "$code" = "1" || { echo "terminal deletion must be detected, got $code"; exit 1; }
      - name: record.py reports errors as exit 3, not as a broken chain
        run: |
          set +e
          echo 'not json' > /tmp/badlog.jsonl
          python3 skills/hanria/scripts/record.py verify --log /tmp/badlog.jsonl; code=$?
          test "$code" = "3" || { echo "malformed log must exit 3, got $code"; exit 1; }
          python3 skills/hanria/scripts/record.py append --log /tmp/x.jsonl \
            --action /nope.json --outcome /nope.json; code=$?
          test "$code" = "3" || { echo "missing inputs must exit 3, got $code"; exit 1; }
      - name: Manifests do not assert enforcement
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('plugin.json')); s=json.load(open('hanria-skill.json'))
          banned={'policy-enforcement','reference-monitor','credential-mediation','enforcement'}
          bad=banned & set(p.get('keywords',[]))
          assert not bad, f'plugin.json keywords assert enforcement: {bad}'
          assert s.get('runtime_required') is False, 'skill no longer requires a runtime to check'
          assert s.get('enforcement_provided_by_skill') is False
          print('manifests consistent:', p['version'], s['version'])
          PY
      - name: An unreachable restricting clause is refused, not silently dead
        run: |
          set +e
          out=$(python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.shadowed-denial.json \
            --action skills/hanria/examples/action.read-ticket.json); code=$?
          echo "$out"
          test "$code" = "3" || { echo "a shadowed denial must error, got $code"; exit 1; }
          grep -q 'unreachable' <<<"$out" || { echo "expected the reason to name unreachability"; exit 1; }
      - name: The shipped example mandate actually protects what its notes claim
        run: |
          set +e
          M=skills/hanria/examples/mandate.example.json
          for a in secrets-dir traversal; do
            python3 skills/hanria/scripts/check_action.py --mandate $M \
              --action skills/hanria/examples/action.$a.json; code=$?
            test "$code" = "1" || { echo "action.$a must be denied, got $code"; exit 1; }
          done
      - name: A parent-directory segment in a target is refused
        run: |
          set +e
          python3 -c "import json; json.dump({'schema_version':'0.1-draft','requested_by':{'agent':'x'},'operation':{'kind':'file','verb':'read','target':'/srv/tickets/../../etc/shadow'},'justification':'t'}, open('/tmp/tr.json','w'))"
          out=$(python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json --action /tmp/tr.json); code=$?
          echo "$out"
          test "$code" = "1" || { echo "traversal must deny, got $code"; exit 1; }
          grep -q 'parent-directory' <<<"$out" || exit 1
      - name: An unrecognized request field does not permit
        run: |
          set +e
          python3 -c "import json; a=json.load(open('skills/hanria/examples/action.read-ticket.json')); a['extra_field']='x'; json.dump(a,open('/tmp/xf.json','w'))"
          python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json --action /tmp/xf.json; code=$?
          test "$code" = "1" || { echo "unrecognized request field must deny, got $code"; exit 1; }
      - name: README and SKILL.md agree that the skill cannot enforce
        run: |
          for f in README.md SKILL.md skills/hanria/SKILL.md; do
            grep -qi 'cannot enforce\|does not enforce\|cannot prevent' "$f" \
              || { echo "$f does not state that the skill cannot enforce"; exit 1; }
            grep -qiE 'no (released, packaged or obtainable )?HANRIA runtime exists|not released' "$f" \
              || { echo "$f does not state the runtime is unreleased"; exit 1; }
          done
          grep -qi 'runtime client\|Request a governed action through a local HANRIA runtime' README.md \
            && { echo "README retains pre-rewrite runtime-client framing"; exit 1; }
          echo "README and SKILL.md consistent"
      - name: Schema-invalid mandates and requests never permit
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          M = 'skills/hanria/examples/mandate.example.json'
          A = 'skills/hanria/examples/action.read-ticket.json'
          base_a, base_m = json.load(open(A)), json.load(open(M))
          def mut(doc, **kw):
              d = json.loads(json.dumps(doc)); d.update(kw); return d
          cases = []
          cases.append(('request schema_version', 'a', mut(base_a, schema_version='WRONG')))
          cases.append(('requested_by null', 'a', mut(base_a, requested_by=None)))
          cases.append(('justification null', 'a', mut(base_a, justification=None)))
          cases.append(('justification blank', 'a', mut(base_a, justification='   ')))
          cases.append(('mandate_id null', 'm', mut(base_m, mandate_id=None)))
          cases.append(('purpose null', 'm', mut(base_m, purpose=None)))
          cases.append(('requires_human string', 'm', mut(base_m, requires_human='')))
          m = json.loads(json.dumps(base_m)); m['clauses'][0]['id'] = ''
          cases.append(('empty clause id', 'm', m))
          m = json.loads(json.dumps(base_m)); m['clauses'][0]['note'] = {'x': 1}
          cases.append(('object clause note', 'm', m))
          bad = []
          for name, which, doc in cases:
              if which == 'a':
                  json.dump(doc, open('/tmp/ca.json', 'w'))
                  args = ['--mandate', M, '--action', '/tmp/ca.json']
              else:
                  json.dump(doc, open('/tmp/cm.json', 'w'))
                  args = ['--mandate', '/tmp/cm.json', '--action', A]
              r = subprocess.run(['python3', 'skills/hanria/scripts/check_action.py'] + args,
                                 capture_output=True, text=True)
              try:
                  outcome = json.loads(r.stdout)['outcome']
              except Exception:
                  outcome = 'NO-JSON'
              print('%-24s -> %s (exit %d)' % (name, outcome, r.returncode))
              if outcome == 'permit' or r.returncode == 0:
                  bad.append(name)
          assert not bad, 'these permitted and must not: %s' % bad
          print('all schema-invalid inputs failed closed')
          PY
      - name: A tiered mandate is accepted, not rejected as unreachable
        run: |
          set +e
          python3 - <<'PY'
          import json
          json.dump({"schema_version":"0.2-draft","mandate_id":"tiered","purpose":"tiers",
            "default":"deny","clauses":[
              {"id":"small","effect":"permit","match":{"kind":["transaction"],"verb":["refund"],
                "max_amount":{"value":"50.00","currency":"USD"}}},
              {"id":"medium","effect":"escalate","match":{"kind":["transaction"],"verb":["refund"],
                "max_amount":{"value":"500.00","currency":"USD"}}}]},
            open('/tmp/tiered.json','w'))
          def req(v):
              json.dump({"schema_version":"0.1-draft","requested_by":{"agent":"x"},
                "operation":{"kind":"transaction","verb":"refund","target":"o1",
                  "amount":{"value":v,"currency":"USD"}},"justification":"t"},
                open('/tmp/r_%s.json' % v,'w'))
          for v in ("20.00","100.00","900.00"): req(v)
          PY
          for pair in "20.00 0" "100.00 2" "900.00 1"; do
            set -- $pair
            python3 skills/hanria/scripts/check_action.py --mandate /tmp/tiered.json --action /tmp/r_$1.json
            code=$?
            test "$code" = "$2" || { echo "tiered USD $1: want exit $2, got $code"; exit 1; }
          done
          echo "tiered mandate behaves as written"
      - name: append refuses a log truncated to empty against a retained head
        run: |
          set +e
          L=/tmp/stale.jsonl; rm -f $L $L.head
          python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json \
            --action skills/hanria/examples/action.read-ticket.json > /tmp/o.json
          for i in 1 2 3; do
            python3 skills/hanria/scripts/record.py append --log $L \
              --action skills/hanria/examples/action.read-ticket.json --outcome /tmp/o.json
          done
          : > $L
          python3 skills/hanria/scripts/record.py append --log $L \
            --action skills/hanria/examples/action.read-ticket.json --outcome /tmp/o.json; code=$?
          test "$code" = "1" || { echo "append over a truncated log must return 1, got $code"; exit 1; }
          test ! -s $L || { echo "append must not have written a new genesis entry"; exit 1; }
          python3 -c "import json;assert json.load(open('/tmp/stale.jsonl.head'))['count']==3"
          echo "append refused and left the head intact"
      - name: A broken chain is exit 1 from append as well as verify
        run: |
          set +e
          L=/tmp/brk.jsonl; rm -f $L $L.head
          for a in read-ticket read-home refund; do
            python3 skills/hanria/scripts/check_action.py \
              --mandate skills/hanria/examples/mandate.example.json \
              --action skills/hanria/examples/action.$a.json > /tmp/o_$a.json
            python3 skills/hanria/scripts/record.py append --log $L \
              --action skills/hanria/examples/action.$a.json --outcome /tmp/o_$a.json
          done
          python3 -c "import json; e=[json.loads(l) for l in open('/tmp/brk.jsonl') if l.strip()]; e[1]['body']['outcome']['outcome']='permit'; open('/tmp/brk.jsonl','w').write(chr(10).join(json.dumps(x,sort_keys=True,separators=(',',':')) for x in e)+chr(10))"
          python3 skills/hanria/scripts/record.py verify --log $L; test "$?" = "1" || { echo "verify must return 1"; exit 1; }
          python3 skills/hanria/scripts/record.py append --log $L \
            --action skills/hanria/examples/action.read-ticket.json --outcome /tmp/o_read-ticket.json; code=$?
          test "$code" = "1" || { echo "append onto a broken chain must return 1, got $code"; exit 1; }
      - name: No surface asserts or reserves rights in the name
        run: |
          # First character bracketed so this line does not match its own pattern.
          ! grep -rIn --exclude-dir=.git -E '[g]rants no rights in the name HANRIA|[n]o licence to use the name|[d]o not present it as HANRIA' . \
            || { echo "a surface asserts or reserves rights in the name"; exit 1; }
          python3 -c "
          import re,sys
          t=re.sub(r'\s+',' ',open('TRADEMARK.md').read())
          assert 'No registration or completed clearance is claimed' in t, \
              'TRADEMARK.md must disclaim registration and completed clearance'
          print('TRADEMARK.md disclaims registration and completed clearance')
          "
      - name: Availability prohibitions are scoped to the runtime, not to HANRIA
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('hanria-skill.json'))
          never = ' | '.join(d['agent_obligations']['never'])
          assert 'describe HANRIA as available' not in never, \
              'the prohibition must name the runtime, not HANRIA, which contradicts the released skill'
          assert d['runtime_required'] is False
          assert 'request' not in d['entrypoints'], 'the removed runtime client must not be advertised'
          print('availability prohibitions correctly scoped')
          PY
      - name: Every document is validated against its published schema
        run: |
          python3 - <<'PY'
          import glob, json, sys
          sys.path.insert(0, 'skills/hanria/scripts')
          import _schema
          # The validator must refuse any keyword it does not implement, so a
          # schema cannot grow a constraint that is silently ignored.
          for f in glob.glob('skills/hanria/schema/*.json'):
              def walk(sch, path='$'):
                  un = set(sch) - _schema.SUPPORTED
                  assert not un, '%s uses unimplemented keyword(s) %s at %s' % (f, sorted(un), path)
                  for k, v in sch.get('properties', {}).items():
                      walk(v, '%s.%s' % (path, k))
                  if 'items' in sch:
                      walk(sch['items'], path + '[]')
              walk(_schema.load(f))
          m = _schema.load('skills/hanria/schema/mandate.schema.json')
          a = _schema.load('skills/hanria/schema/action-request.schema.json')
          for f in sorted(glob.glob('skills/hanria/examples/*.json')):
              _schema.validate(json.load(open(f)), m if 'mandate' in f else a, f)
          print('schemas self-consistent; every shipped example conforms')
          PY
      - name: Emitted outcomes conform to the published outcome schema
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          sys.path.insert(0, 'skills/hanria/scripts')
          import _schema
          sch = _schema.load('skills/hanria/schema/action-outcome.schema.json')
          M = 'skills/hanria/examples/mandate.example.json'
          cases = [(M, 'skills/hanria/examples/action.%s.json' % a)
                   for a in ('read-ticket', 'read-home', 'refund', 'refund-too-large', 'traversal')]
          cases.append(('skills/hanria/examples/mandate.shadowed-denial.json',
                        'skills/hanria/examples/action.read-ticket.json'))
          for m, a in cases:
              r = subprocess.run(['python3', 'skills/hanria/scripts/check_action.py',
                                  '--mandate', m, '--action', a], capture_output=True, text=True)
              _schema.validate(json.loads(r.stdout), sch, 'outcome from %s' % a)
          print('every emitted outcome conforms to its published schema')
          PY
      - name: Nested schema violations and non-RFC-3339 expiries never permit
        run: |
          python3 - <<'PY'
          import json, subprocess
          M = 'skills/hanria/examples/mandate.example.json'
          A = 'skills/hanria/examples/action.read-ticket.json'
          ba, bm = json.load(open(A)), json.load(open(M))
          def cp(d):
              return json.loads(json.dumps(d))
          cases = []
          d = cp(ba); d['requested_by']['bogus'] = 'x';           cases.append(('unknown requested_by prop', 'a', d))
          d = cp(ba); d['requested_by']['session'] = 12345;       cases.append(('numeric session', 'a', d))
