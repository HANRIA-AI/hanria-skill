            --action skills/hanria/examples/action.read-home.json --outcome /tmp/o_permit.json; code=$?
          test "$code" = "3" || { echo "a mismatched action/outcome pair must be refused, got $code"; exit 1; }
          test ! -s $L || { echo "nothing should have been written"; exit 1; }
          python3 skills/hanria/scripts/record.py append --log $L \
            --action skills/hanria/examples/action.read-ticket.json --outcome /tmp/o_permit.json; code=$?
          test "$code" = "0" || { echo "the matching pair must record, got $code"; exit 1; }
      - name: Concurrent appends do not corrupt or lose entries
        run: |
          set +e
          L=/tmp/conc.jsonl; rm -f $L $L.head $L.lock
          python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json \
            --action skills/hanria/examples/action.read-ticket.json > /tmp/o.json
          for i in $(seq 1 8); do
            python3 skills/hanria/scripts/record.py append --log $L \
              --action skills/hanria/examples/action.read-ticket.json --outcome /tmp/o.json &
          done
          wait
          n=$(grep -c . $L)
          test "$n" = "8" || { echo "expected 8 entries, got $n"; exit 1; }
          python3 skills/hanria/scripts/record.py verify --log $L || { echo "chain must verify"; exit 1; }
