name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Schemas and manifests are valid JSON
        run: |
          for f in skills/hanria/schema/*.json plugin.json hanria-skill.json skills/hanria/examples/*.json; do
            python3 -c "import json,sys;json.load(open('$f'));print('ok $f')"
          done
      - name: Detection reports absent, and exits 1
        run: |
          set +e
          out=$(python3 skills/hanria/scripts/detect_runtime.py); code=$?
          echo "$out"
          test "$code" = "1" || { echo "expected exit 1 (absent), got $code"; exit 1; }
          echo "$out" | grep -q '"status": "absent"' || { echo "expected status absent"; exit 1; }
      - name: A request carrying a credential is refused locally, never sent
        run: |
          set +e
          out=$(python3 skills/hanria/scripts/request_action.py --file skills/hanria/examples/rejected-secret.json); code=$?
          echo "$out"
          test "$code" = "3" || { echo "expected exit 3, got $code"; exit 1; }
          echo "$out" | grep -q 'NOT sent' || { echo "expected local refusal"; exit 1; }
          echo "$out" | grep -q 'operation.parameters.api_key' || { echo "expected offending path named"; exit 1; }
      - name: A clean request with no runtime does NOT fabricate an outcome
        run: |
          set +e
          out=$(python3 skills/hanria/scripts/request_action.py --file skills/hanria/examples/read-file.json); code=$?
          echo "$out"
          test "$code" = "3" || { echo "expected exit 3, got $code"; exit 1; }
          echo "$out" | grep -q 'no HANRIA runtime is installed' || exit 1
          echo "$out" | grep -qv '"outcome": "permit"' || { echo "must never synthesize permit"; exit 1; }
      - name: plugin.json conforms to Agent Plugins 1.0.0
        run: |
          python3 - <<'PY'
          import json,re,sys
          d=json.load(open('plugin.json'))
          allowed={'$schema','name','version','description','author','homepage','repository','license','keywords','extensions'}
          extra=set(d)-allowed
          assert not extra, f'non-spec top-level fields: {extra}'
          assert d.get('$schema')=='https://agent-plugins.org/schemas/1.0.0/plugin.schema.json', 'wrong $schema'
          n=d['name']
          assert 1<=len(n)<=64 and re.fullmatch(r'[a-z0-9][a-z0-9.-]*[a-z0-9]',n) and '--' not in n and '..' not in n, f'bad name: {n}'
          print('plugin.json conforms:',n)
          PY
      - name: Skill is discoverable at both the root and the plugin path
        run: |
          test -f SKILL.md || { echo "SKILL.md missing at root (breaks npx skills add)"; exit 1; }
          test -f skills/hanria/SKILL.md || { echo "skills/hanria/SKILL.md missing (breaks Agent Plugins)"; exit 1; }
      - name: No credential-shaped literals committed
        run: |
          ! grep -rIn --exclude-dir=.git -E 'sk-live-[A-Za-z0-9]{12,}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY' . \
            || { echo "possible secret committed"; exit 1; }
      - name: The operator entity is not named anywhere
        run: |
          # Bracketed so this line does not match its own pattern.
          ! grep -rIn --exclude-dir=.git -i '[k]aal' . \
            || { echo "operator entity must not appear on any HANRIA surface"; exit 1; }
      - name: Mandate check returns permit, deny and escalate correctly
        run: |
          set +e
          M=skills/hanria/examples/mandate.example.json
          check () {
            out=$(python3 skills/hanria/scripts/check_action.py --mandate $M --action "$1"); code=$?
            echo "$out"
            test "$code" = "$2" || { echo "$1: expected exit $2, got $code"; exit 1; }
            echo "$out" | grep -q "\"outcome\": \"$3\"" || { echo "$1: expected $3"; exit 1; }
          }
          check skills/hanria/examples/action.read-ticket.json 0 permit
          check skills/hanria/examples/action.read-home.json 1 deny
          check skills/hanria/examples/action.refund.json 2 escalate
      - name: An amount over the clause ceiling does not permit
        run: |
          set +e
          out=$(python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json \
            --action skills/hanria/examples/action.refund-too-large.json); code=$?
          echo "$out"
          test "$code" = "1" || { echo "expected deny (exit 1), got $code"; exit 1; }
          echo "$out" | grep -q 'exceeds the ceiling' || { echo "expected the ceiling named in the reason"; exit 1; }
      - name: A request carrying a credential is denied by the checker too
        run: |
          set +e
          out=$(python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json \
            --action skills/hanria/examples/rejected-secret.json); code=$?
          echo "$out"
          test "$code" = "1" || { echo "expected deny (exit 1), got $code"; exit 1; }
          echo "$out" | grep -q 'credential' || exit 1
      - name: Evaluation fails closed on an expired or malformed mandate
        run: |
          set +e
          python3 -c "import json;m=json.load(open('skills/hanria/examples/mandate.example.json'));m['not_valid_after']='2020-01-01T00:00:00Z';json.dump(m,open('/tmp/expired.json','w'))"
          out=$(python3 skills/hanria/scripts/check_action.py --mandate /tmp/expired.json \
            --action skills/hanria/examples/action.read-ticket.json); code=$?
          echo "$out"
          test "$code" = "1" || { echo "expired mandate must deny, got $code"; exit 1; }
          echo '{"schema_version":"0.2-draft"}' > /tmp/bad.json
          out=$(python3 skills/hanria/scripts/check_action.py --mandate /tmp/bad.json \
            --action skills/hanria/examples/action.read-ticket.json); code=$?
          echo "$out"
          test "$code" = "3" || { echo "malformed mandate must error, got $code"; exit 1; }
          echo "$out" | grep -qv '"outcome": "permit"' || { echo "must never permit"; exit 1; }
      - name: The log chain detects alteration and deletion
        run: |
          set +e
          L=/tmp/chain.jsonl; rm -f $L
          for a in read-ticket read-home refund; do
            python3 skills/hanria/scripts/check_action.py \
              --mandate skills/hanria/examples/mandate.example.json \
              --action skills/hanria/examples/action.$a.json > /tmp/out.json
            python3 skills/hanria/scripts/record.py append --log $L \
              --action skills/hanria/examples/action.$a.json --outcome /tmp/out.json
          done
          python3 skills/hanria/scripts/record.py verify --log $L || { echo "fresh chain must verify"; exit 1; }
          python3 - <<'PY'
          import json
          e=[json.loads(l) for l in open('/tmp/chain.jsonl') if l.strip()]
          e[1]['body']['outcome']['outcome']='permit'
          open('/tmp/chain.jsonl','w').write('\n'.join(json.dumps(x,sort_keys=True,separators=(',',':')) for x in e)+'\n')
          PY
          python3 skills/hanria/scripts/record.py verify --log $L; code=$?
          test "$code" = "1" || { echo "a flipped outcome must break the chain, got $code"; exit 1; }
          python3 skills/hanria/scripts/record.py append --log $L \
            --action skills/hanria/examples/action.read-ticket.json --outcome /tmp/out.json; code=$?
          test "$code" != "0" || { echo "must refuse to append to a broken chain"; exit 1; }
      - name: Credential shapes are refused even in innocuous field names
        run: |
          set +e
          M=skills/hanria/examples/mandate.example.json
          mk () {
            python3 -c "import json,sys; json.dump({'schema_version':'0.1-draft','requested_by':{'agent':'x'},'operation':{'kind':'file','verb':'read','target':'/srv/tickets/a.json','parameters':{sys.argv[1]:sys.argv[2]}},'justification':'t'}, open('/tmp/c.json','w'))" "$1" "$2"
          }
          try () {
            mk "$1" "$2"
            python3 skills/hanria/scripts/check_action.py --mandate $M --action /tmp/c.json; code=$?
            test "$code" = "1" || { echo "credential in field '$1' was not denied (exit $code)"; exit 1; }
            echo "denied: $1"
          }
          try authorization "Bearer abc.def.ghijkl"
          try cookie "session=abc123def456"
          try note "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.sIgNaTuRe"
          try note "AKIAIOSFODNN7EXAMPLE"
          try note "ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      - name: An unrecognized mandate condition is refused, never ignored
        run: |
          set +e
          python3 -c "import json; m=json.load(open('skills/hanria/examples/mandate.example.json')); m['clauses'][0]['match']['path_regex']='^/other/'; json.dump(m,open('/tmp/m_unknown.json','w'))"
          out=$(python3 skills/hanria/scripts/check_action.py --mandate /tmp/m_unknown.json \
                  --action skills/hanria/examples/action.read-ticket.json); code=$?
          echo "$out"
          test "$code" = "3" || { echo "unknown match key must error, got $code"; exit 1; }
          echo "$out" | grep -qv '"outcome": "permit"' || { echo "must never permit"; exit 1; }
      - name: A string where a list belongs is refused, not iterated per character
        run: |
          set +e
          python3 -c "import json; m=json.load(open('skills/hanria/examples/mandate.example.json')); m['clauses'][0]['match']['target_prefix']='/srv/tickets/'; json.dump(m,open('/tmp/m_str.json','w'))"
          python3 skills/hanria/scripts/check_action.py --mandate /tmp/m_str.json \
            --action skills/hanria/examples/action.read-home.json; code=$?
          test "$code" = "3" || { echo "string target_prefix must error, got $code"; exit 1; }
      - name: A request missing required fields does not permit
        run: |
          set +e
          echo '{"operation":{"kind":"file","verb":"read","target":"/srv/tickets/a.json"}}' > /tmp/bare.json
          python3 skills/hanria/scripts/check_action.py \
            --mandate skills/hanria/examples/mandate.example.json --action /tmp/bare.json; code=$?
          test "$code" = "1" || { echo "incomplete request must deny, got $code"; exit 1; }
      - name: Non-finite and negative amounts error rather than compare
        run: |
          set +e
          for v in NaN Infinity -100.00; do
            python3 -c "import json,sys; a=json.load(open('skills/hanria/examples/action.refund.json')); a['operation']['amount']['value']=sys.argv[1]; json.dump(a,open('/tmp/amt.json','w'))" "$v"
            python3 skills/hanria/scripts/check_action.py \
              --mandate skills/hanria/examples/mandate.example.json --action /tmp/amt.json; code=$?
            test "$code" = "3" || { echo "amount '$v' must error, got $code"; exit 1; }
          done
      - name: Terminal truncation of the log is detected via the head file
        run: |
          set +e
          L=/tmp/trunc.jsonl; rm -f $L $L.head
          for a in read-ticket read-home refund; do
            python3 skills/hanria/scripts/check_action.py \
              --mandate skills/hanria/examples/mandate.example.json \
              --action skills/hanria/examples/action.$a.json > /tmp/o.json
            python3 skills/hanria/scripts/record.py append --log $L \
              --action skills/hanria/examples/action.$a.json --outcome /tmp/o.json
          done
          python3 skills/hanria/scripts/record.py verify --log $L || { echo "fresh chain must verify"; exit 1; }
          python3 -c "l=[x for x in open('/tmp/trunc.jsonl') if x.strip()][:-1]; open('/tmp/trunc.jsonl','w').writelines(l)"
          out=$(python3 skills/hanria/scripts/record.py verify --log $L); code=$?
          echo "$out"
          test "$code" = "1" || { echo "terminal deletion must be detected, got $code"; exit 1; }
      - name: record.py reports errors as exit 3, not as a broken chain
        run: |
          set +e
          echo 'not json' > /tmp/badlog.jsonl
          python3 skills/hanria/scripts/record.py verify --log /tmp/badlog.jsonl; code=$?
          test "$code" = "3" || { echo "malformed log must exit 3, got $code"; exit 1; }
          python3 skills/hanria/scripts/record.py append --log /tmp/x.jsonl \
            --action /nope.json --outcome /nope.json; code=$?
          test "$code" = "3" || { echo "missing inputs must exit 3, got $code"; exit 1; }
      - name: Manifests do not assert enforcement
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('plugin.json')); s=json.load(open('hanria-skill.json'))
          banned={'policy-enforcement','reference-monitor','credential-mediation','enforcement'}
          bad=banned & set(p.get('keywords',[]))
          assert not bad, f'plugin.json keywords assert enforcement: {bad}'
          assert s.get('runtime_required') is False, 'skill no longer requires a runtime to check'
          assert s.get('enforcement_provided_by_skill') is False
          print('manifests consistent:', p['version'], s['version'])
          PY
