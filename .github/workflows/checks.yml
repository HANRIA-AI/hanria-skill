          json.dump({'schema_version':'0.1-draft','requested_by':{'agent':'x'},'operation':{'kind':'transaction','verb':'pay','target':'o','counterparty':'blocked'},'justification':'t'},open('/tmp/eb_a.json','w'))"
          python3 skills/hanria/scripts/check_action.py --mandate /tmp/eb.json --action /tmp/eb_a.json; code=$?
