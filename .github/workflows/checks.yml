          json.dump({'schema_version':'0.1-draft','requested_by':{'agent':'x'},'operation':{'kind':'network','verb':'get','target':'https://trusted.example/api/%2e%2e/admin'},'justification':'t'},open('/tmp/enc_a.json','w'))"
