      - name: The evaluator and recorder import no network facility
        run: |
          python3 - <<'PY'
          import ast
          for f in ('skills/hanria/scripts/check_action.py',
                    'skills/hanria/scripts/record.py',
                    'skills/hanria/scripts/_schema.py'):
              tree = ast.parse(open(f).read())
              names = set()
              for n in ast.walk(tree):
                  if isinstance(n, ast.Import):
                      names |= {a.name.split('.')[0] for a in n.names}
                  elif isinstance(n, ast.ImportFrom) and n.module:
                      names.add(n.module.split('.')[0])
              banned = names & {'socket', 'http', 'urllib', 'requests', 'ftplib',
                                'smtplib', 'telnetlib', 'asyncio', 'ssl', 'xmlrpc'}
              assert not banned, '%s imports %s' % (f, sorted(banned))
          print('no network facility in the evaluator, recorder or validator')
          PY
