name: fuzz
# The input fuzzer, the reference evaluator, the log exerciser and the
# schema exerciser at length, on request. The push gate runs each small;
# this runs as many as asked on the runner and uploads any finding with
# the run.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Cases for the input fuzzer'
        required: false
        default: '20000'
      pairs:
        description: 'Pairs for the reference evaluator'
        required: false
        default: '500000'
      logs:
        description: 'Logs for the log exerciser'
        required: false
        default: '2000'
      texts:
        description: 'Texts and pairs, each, for the schema exerciser'
        required: false
        default: '1000000'
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fuzz the scripts' inputs
        run: |
          set +e
          python3 tools/fuzz_inputs.py --cases ${{ inputs.cases }} --jobs "$(nproc)" --seed "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/fuzz.out"
          code=$?
          echo "fuzzer exit $code"
          test "$code" = "0" || exit 1
      - name: The reference evaluator against the checker
        run: |
          set +e
          python3 tools/model_evaluator.py --pairs ${{ inputs.pairs }} --seed "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/fuzz.out/model"
          code=$?
          echo "reference evaluator exit $code"
          test "$code" = "0" || exit 1
      - name: The log exerciser against its model
        run: |
          set +e
          python3 tools/log_exerciser.py --logs ${{ inputs.logs }} --seed "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/fuzz.out/log"
          code=$?
          echo "log exerciser exit $code"
          test "$code" = "0" || exit 1
      - name: The schema exerciser against its reference
        run: |
          set +e
          python3 tools/schema_exerciser.py --texts ${{ inputs.texts }} --pairs ${{ inputs.texts }} --seed "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/fuzz.out/schema"
          code=$?
          echo "schema exerciser exit $code"
          test "$code" = "0" || exit 1
      - name: Findings, if any, travel with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz.out
          path: ${{ runner.temp }}/fuzz.out
          if-no-files-found: ignore
